description = "Reusable-cell diagnosis and pack-allocation simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "pyarrow>=18,<24",
  "ipykernel>=6.29,<8",
]

[tool.uv]
package = false
